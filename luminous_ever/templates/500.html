<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Something went wrong — Luminous Ever</title>
  <style>
    /* Deliberately inline and self-contained — this page must render even
       if static file serving or the database is what's broken. No
       static-file tags, no site_settings, no template inheritance. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .wrap { max-width: 420px; }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
    }
    p {
      color: rgba(255, 255, 255, 0.64);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      color: #050505;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9375rem;
      padding: 0.9rem 1.75rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Something went wrong on our end.</h1>
    <p>Not you — us. Try again in a moment, or head back home.</p>
    <a class="btn" href="/">Back Home</a>
  </div>
</body>
</html>
